<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원/달러 환율 전광판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="board-header">
  <div class="board-header__left">
    <span class="board-header__mark">₩ / $</span>
    <div>
      <h1>원/달러 환율 전광판</h1>
      <p class="board-header__sub">한국은행 ECOS 매매기준율 기반 시계열 분석 대시보드</p>
    </div>
  </div>
  <div class="board-header__meta" id="metaInfo">데이터 불러오는 중…</div>
</header>

<main>

  <section class="panel controls" aria-label="조회 기간 설정">
    <div class="controls__presets" id="presetButtons">
      <button data-range="all" class="preset is-active">전체</button>
      <button data-range="365">최근 1년</button>
      <button data-range="180">최근 6개월</button>
      <button data-range="90">최근 3개월</button>
      <button data-range="30">최근 1개월</button>
    </div>
    <div class="controls__custom">
      <label>시작일<input type="date" id="startDate"></label>
      <label>종료일<input type="date" id="endDate"></label>
    </div>
  </section>

  <p class="range-error" id="rangeError" hidden></p>

  <section class="panel chart-panel">
    <div class="chart-panel__head">
      <h2>환율 추이 &amp; 이동평균</h2>
      <div class="legend">
        <span><i class="dot dot--price"></i>종가</span>
        <span><i class="dot dot--ma20"></i>20일 이동평균</span>
        <span><i class="dot dot--ma60"></i>60일 이동평균</span>
      </div>
    </div>
    <canvas id="priceChart" height="110"></canvas>
  </section>

  <section class="ticker-row" id="tickerRow" aria-label="선택 구간 요약 통계">
    <div class="ticker-cell">
      <span class="ticker-cell__label">구간 시작</span>
      <span class="ticker-cell__value" id="statStart">–</span>
    </div>
    <div class="ticker-cell">
      <span class="ticker-cell__label">구간 종료</span>
      <span class="ticker-cell__value" id="statEnd">–</span>
    </div>
    <div class="ticker-cell">
      <span class="ticker-cell__label">최고가</span>
      <span class="ticker-cell__value" id="statMax">–</span>
    </div>
    <div class="ticker-cell">
      <span class="ticker-cell__label">최저가</span>
      <span class="ticker-cell__value" id="statMin">–</span>
    </div>
    <div class="ticker-cell">
      <span class="ticker-cell__label">구간 변동률</span>
      <span class="ticker-cell__value" id="statChange">–</span>
    </div>
    <div class="ticker-cell">
      <span class="ticker-cell__label">데이터 수</span>
      <span class="ticker-cell__value" id="statCount">–</span>
    </div>
  </section>

  <section class="panel volatility-panel">
    <h2>20일 구간 변동성</h2>
    <canvas id="volChart" height="70"></canvas>
  </section>

  <section class="panel ai-panel">
    <div class="ai-panel__head">
      <h2>AI 시황 해설</h2>
      <button id="aiButton">이 구간 해설 보기</button>
    </div>
    <div id="aiOutput" class="ai-output ai-output--empty">
      기간을 선택하고 버튼을 누르면, 해당 구간의 환율 흐름을 AI가 한두 문장으로 요약해드립니다.
    </div>
  </section>

</main>

<footer>
  <p>데이터 출처: 한국은행 경제통계시스템(ECOS) 원/달러 매매기준율 · 본 대시보드는 참고용이며 투자 조언이 아닙니다.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
